<!doctype html>
<html lang="zh-Hans">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#181818" />
    <meta
      name="description"
      content="可直接游玩的迷你游戏。"
    />
    <title>迷你游戏</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header shell">
      <a class="wordmark" href="./" aria-label="返回迷你游戏首页">迷你游戏</a>
    </header>

    <main>
      <section class="collection shell" id="collection" aria-labelledby="collection-title">
        <div class="section-heading">
          <h1 id="collection-title">游戏列表</h1>
          <p id="collection-count" class="collection-count" aria-live="polite"></p>
        </div>
        <div id="game-grid" class="game-grid" aria-live="polite"></div>
      </section>
    </main>
    <script type="module" src="./app.js"></script>
  </body>
</html>
